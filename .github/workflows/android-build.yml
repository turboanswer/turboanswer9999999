name: Build Android AAB + APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'client/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Normalize lockfile registry URLs
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building UNSIGNED AAB (Play Store will reject)."
            echo "To set up: base64 -w0 android/app/turboanswer-release.keystore | pbcopy, then add as repo secret."
            exit 0
          fi
          # Strip any whitespace/newlines that paste introduces, then decode
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/turboanswer-release.keystore 2> /tmp/b64err.log || {
            echo "::error::base64 decode failed. You likely pasted the BINARY .keystore file instead of the .txt base64 file."
            echo "::error::Open turboanswer-keystore-base64.txt from the tar.gz and paste THAT into the ANDROID_KEYSTORE_BASE64 secret."
            cat /tmp/b64err.log
            exit 1
          }
          SIZE=$(wc -c < android/app/turboanswer-release.keystore)
          echo "Keystore decoded: $SIZE bytes (expected ~2770)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Keystore too small — secret value appears truncated/corrupted."
            exit 1
          fi

      - name: Build signed AAB + APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_PASS" ]; then
            ./gradlew bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/turboanswer-release.keystore \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-turboanswer}" \
              -Pandroid.injected.signing.key.password="$KEY_PASS" \
              --stacktrace
          else
            echo "No signing secrets — building debug APK only"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload AAB (Play Store)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turboanswer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload APK (sideload + testers)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turboanswer-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
